server.port=8085
spring.application.name=claim-service

# Bases de datos
spring.mongodb.uri=mongodb://localhost:27017/claims_db
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Descomenta la siguiente línea si corres solo tu servicio sin Eureka (quita los avisos en el log):
# eureka.client.enabled=false

# Configuración propia del servicio
claims.otp.ttl-minutes=5
claims.otp.max-attempts=3
claims.fraud.max-claims-per-day=3
claims.fraud.min-description-length=20
claims.fraud.suspicious-threshold=50
claims.resolve.allowed-roles=ADMIN